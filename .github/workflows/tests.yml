name: Run tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from tags.
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and package
        # --python pins the interpreter explicitly. Without it uv picks one by
        # discovery, which happens to find the matrix version on PATH today
        # but is not guaranteed to -- and if it ever stopped, every job would
        # silently test the same interpreter and stay green.
        run: |
          uv sync --extra dev --no-editable --python "${{ matrix.python-version }}"
      - name: Confirm the interpreter matches the matrix
        # The pin above only requests a version; this proves we got it, so a
        # degraded matrix fails loudly instead of passing four times over.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          uv run --no-sync python -c "
          import os, sys
          expected = os.environ['EXPECTED']
          actual = '.'.join(map(str, sys.version_info[:2]))
          assert actual == expected, f'expected Python {expected}, got {actual}'
          print(f'running on Python {sys.version.split()[0]}')
          "
      - name: List Python package versions
        run: uv pip list
      - name: Run tests
        run: |
          uv run --no-sync pytest -q lume_pyat/tests

  readme-example:
    # The README's example is the package's front door. Running it here is what
    # stops it drifting from the code it advertises.
    name: README example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install the package
        run: uv sync --no-editable --python 3.12
      - name: Extract and run the example
        run: |
          uv run --no-sync python - <<'PY'
          import pathlib
          import re

          readme = pathlib.Path("README.md").read_text()
          _, _, after_heading = readme.partition("\n## Example\n")
          match = re.search(r"^```python\n(.*?)^```", after_heading, re.M | re.S)
          if match is None:
              raise SystemExit("no python example found under the '## Example' heading")

          exec(compile(match.group(1), "README.md", "exec"), {"__name__": "__main__"})
          print("README example ran to completion")
          PY

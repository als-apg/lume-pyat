name: Lint

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit on all files
        env:
          RUFF_OUTPUT_FORMAT: github
        run: |
          pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --all-files

  facility-agnostic:
    # The package must carry no facility-specific naming, data, or references.
    # Any match below is a leak and fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for facility-specific references
        # Explicit separators rather than \b, on both sides: an underscore is
        # a word character, so \b never fires inside an identifier -- the
        # exact shape a real leak takes. The bracket classes deliberately
        # exclude _, which is what makes an underscore count as a separator.
        # Verified to catch x_alsu_y, sr_alsu_bpm, foo_als_bar and the
        # hyphenated form, and to leave salsa, alsatian, false, signals and
        # intervals_used alone.
        run: |
          if grep -rinE '(^|[^a-zA-Z0-9])(als[-_]?u|als|osprey)([^a-zA-Z0-9]|$)' lume_pyat/; then
            echo "::error::facility-specific reference found in lume_pyat/"
            exit 1
          fi
          echo "no facility-specific references found"

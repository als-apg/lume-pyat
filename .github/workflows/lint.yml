name: Lint

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit on all files
        env:
          RUFF_OUTPUT_FORMAT: github
        run: |
          pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --all-files

  facility-agnostic:
    # The package must carry no facility-specific naming, data, or references.
    # Any match below is a leak and fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for facility-specific references
        # The leading (^|[^A-Za-z]) rather than \b is load-bearing: an
        # underscore is a word character, so \b never matches inside
        # ring_als_u_ar or X_ALS_U_AR -- the exact shape a real leak takes.
        # Excluding letters (rather than using \b) still rejects the words
        # that would otherwise trip it: intervals_used, totals, signals,
        # normals_used, also, false.
        run: |
          if grep -rinE '(^|[^A-Za-z])als[-_]?u|\b(als|osprey)\b' lume_pyat/; then
            echo "::error::facility-specific reference found in lume_pyat/"
            exit 1
          fi
          echo "no facility-specific references found"
